<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Fahad Asi Manea Al-Zaferi Co — Sit Cover, TV Remote &amp; Machine Shop Kuwait</title>
  <meta name="description" content="Local Kuwait shop — TV remotes, seat covers, machines and more. Order online with home delivery or cash on delivery. AI assistant included.">
  <meta name="theme-color" content="#0f172a">
  <link rel="icon" href="assets/logo.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/style.css">
  <script>
    function googleTranslateElementInit() {
      try {
        if (window.google && google.translate) {
          new google.translate.TranslateElement({ pageLanguage: 'en', autoDisplay: false }, 'google_translate_element');
        }
      } catch (e) {}
    }
  </script>
</head>
<body>
  <div id="preloader">
    <div class="pre-card">
      <img class="pre-logo" src="assets/logo.svg" alt="logo" style="animation:none;border-radius:50%">
      <div class="pre-name">Fahad Asi Manea Al-Zaferi Co</div>
      <div class="pre-sub">Quality Products • Fast Delivery</div>
      <div class="pre-bar"><i></i></div>
    </div>
  </div>

  <div id="siteHeader"></div>

  <main>
    <div class="tabs-bar" id="tabsBar"></div>
    <div class="wrap sect">
      <div class="sect-head">
        <h2>Our Products</h2>
        <span class="hint">Pick a category above • everything is live from the shop</span>
      </div>
      <div class="grid" id="productGrid"></div>
    </div>
  </main>

  <div id="siteFooter"></div>
  <div id="toast" class="toast"></div>

  <script src="js/config.js"></script>
  <script src="js/core.js"></script>
  <script src="js/home.js"></script>
  <script src="js/ai.js"></script>
</body>
</html>
