<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
  <title>Fahad Asi Manea Al-Zaferi Co — Sit Cover, TV Remote &amp; Machine Shop Kuwait</title>
  <meta name="description" content="Local Kuwait shop — TV remotes, seat covers, machines and more. Order online with home delivery or cash on delivery. AI assistant included.">
  <meta name="theme-color" content="#0f172a">
  <link rel="icon" href="assets/shop-logo.webp" type="image/webp">
    <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800&display=swap">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800&display=swap" media="print" onload="this.media=&#39;all&#39;">
  <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800&display=swap"></noscript>
<link rel="stylesheet" href="css/style.css">
  <script>
    function googleTranslateElementInit() {
      try {
        if (window.google && google.translate) {
          new google.translate.TranslateElement({ pageLanguage: 'en', autoDisplay: false }, 'google_translate_element');
        }
      } catch (e) {}
    }
  </script>
</head>
<body class="home-page">
  <div id="preloader">
    <div class="pre-card">
      <img class="pre-logo" data-brand="loading" src="assets/shop-logo.webp" alt="logo" style="animation:none;border-radius:50%">
      <div class="pre-name">Fahad Asi Manea Al-Zaferi Co</div>
      <div class="pre-sub">Quality Products • Fast Delivery</div>
      <div class="pre-bar"><i></i></div>
    </div>
  </div>

  <div class="shop-hero" aria-label="Shop banner">
    <img src="assets/shop-banner.webp" alt="Fahad Asi Manea Al-Zaferi Co" decoding="async">
  </div>

  <div class="shop-search wrap" role="search">
    <input id="productSearch" type="search" placeholder="Search products…" autocomplete="off"><span aria-hidden="true">⌕</span>
  </div>

  <div id="siteHeader"></div>

  <main>
    <div class="tabs-bar" id="tabsBar"></div>
    <div class="wrap sect">
      <div class="sect-head">
        <h2>Our Products</h2>
      </div>
      <div class="grid" id="productGrid"></div>
    </div>
  </main>

  <div id="siteFooter"></div>
  <div id="toast" class="toast"></div>

  <script src="js/config.js"></script>
  <script src="js/core.js"></script>
  <script src="js/home.js"></script>
  <script src="js/ai.js"></script>
</body>
</html>
