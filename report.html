<body>
  <div id="preloader">
    <div class="pre-card">
      <img class="pre-logo" data-brand="loading" src="assets/shop-logo.webp" alt="logo">
      <div class="pre-name">Fahad Asi Manea Al-Zaferi Co</div>
      <div class="pre-sub">Report an Issue</div>
      <div class="pre-bar"><i></i></div>
    </div>
  </div>

  <div id="siteHeader"></div>

  <main>
    <div class="wrap sect static-page">
      <div class="card">
        <h1>Report an issue</h1>
        <p class="lead">Tell us what went wrong. A screenshot helps us fix it faster — we review every message.</p>

        <div class="field">
          <label for="rpName">Name</label>
          <input id="rpName" type="text" maxlength="100" placeholder="Your name">
        </div>

        <div class="field">
          <label for="rpPhone">Phone (optional)</label>
          <input id="rpPhone" type="tel" maxlength="30" placeholder="Your phone number">
        </div>

        <div class="field">
          <label for="rpType">Issue type</label>
          <select id="rpType">
            <option>Website problem</option>
            <option>Product problem</option>
            <option>Order problem</option>
            <option>Payment problem</option>
            <option>Other</option>
          </select>
        </div>

        <div class="field">
          <label for="rpMessage">What went wrong? <span class="opt">(optional details help)</span></label>
          <textarea id="rpMessage" class="rp-msg" maxlength="2000" rows="4"
            placeholder="Example: the Submit button on the report page showed an error."></textarea>
          <div class="rp-count" id="rpCount">0 / 2000</div>
        </div>

        <div class="field">
          <label>Screenshot <span class="opt">(optional)</span></label>
          <button type="button" class="rp-shot" id="rpShot">
            <span class="rp-shot-ic" aria-hidden="true">📸</span>
            <span class="rp-shot-tx"><b>Add a screenshot</b><small>Shows us exactly what you saw</small></span>
          </button>
          <input type="file" id="rpFile" accept="image/*" hidden>
          <div class="rp-preview" id="rpPreview" hidden>
            <img id="rpPreviewImg" alt="Screenshot preview">
            <div class="rp-preview-meta">
              <span id="rpPreviewName">screenshot</span>
              <button type="button" class="btn btn-ghost btn-sm" id="rpRemove">Remove</button>
            </div>
          </div>
          <div class="tip">JPG, PNG or WEBP — max 8 MB. It is compressed before it is sent.</div>
        </div>

        <div class="rp-actions">
          <button class="btn btn-pri" id="rpSubmit">Submit Report</button>
          <div id="rpStatus" class="tip" role="status" aria-live="polite"></div>
          <div id="rpWa" class="rp-wa" hidden></div>
        </div>
      </div>
    </div>
  </main>

  <div id="siteFooter"></div>
  <div id="toast" class="toast"></div>
